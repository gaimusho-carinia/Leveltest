<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Einstufungstest</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--muted:#666;--line:#ddd8cc;--accent:#a62c4b;--accent-ink:#fff;--ok:#2d6a4f}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a1c;--card:#262528;--ink:#eee;--muted:#aaa;--line:#3a383d;--accent:#e0607e;--accent-ink:#1b1a1c;--ok:#7bc8a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.4rem;margin:0 0 16px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
button{font:600 1rem system-ui;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 18px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.name{font-weight:700;font-size:1.1rem}
.meta{color:var(--muted);font-size:.9rem}
.badge{font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
pre{white-space:pre-wrap;word-wrap:break-word;font:1rem/1.6 Georgia,serif;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.msg{color:var(--muted);font-size:.9rem;margin-left:10px}
#login{max-width:340px;display:grid;gap:10px}
#login .err{color:#b3261e;min-height:1.2em}
.bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.bar select{width:auto}
</style>
</head>
<body>
<main>
<h1>Einstufungstest – Admin</h1>

<div id="login">
  <input id="em" type="email" placeholder="E-Mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password">
  <button id="in">Anmelden</button>
  <div class="err" id="lerr" role="alert"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <select id="filter"><option value="all">Alle</option><option value="open">Noch nicht bewertet</option><option value="done">Bewertet</option></select>
    <button class="ghost" id="reload">Neu laden</button>
    <button class="ghost" id="out">Abmelden</button>
    <span class="meta" id="cnt"></span>
  </div>
  <div id="list"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://mgvzoprdsfbmcyslztyx.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ndnpvcHJkc2ZibWN5c2x6dHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyODI3MDcsImV4cCI6MjEwNzg1ODcwN30.PmmEMoHwNp4_qKMYxIdpYL6Zxi90uZE47gKq1ND7vRw";
const LEVELS = ["", "A0 (Anfänger)", "A1", "A2", "B1", "B2", "C1", "unter A1"];

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let rows = [];

function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
}
const fmt = d => new Date(d).toLocaleString("de-DE", {dateStyle:"medium", timeStyle:"short"});

async function check(){
  const { data:{ session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("app").hidden = !session;
  if(session) load();
}
$("in").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email:$("em").value.trim(), password:$("pw").value });
  $("lerr").textContent = error ? "Anmeldung fehlgeschlagen." : "";
  if(!error) check();
};
$("out").onclick = async () => { await sb.auth.signOut(); check(); };
$("reload").onclick = load;
$("filter").onchange = render;

async function load(){
  const { data, error } = await sb.from("participants").select("*, writings(*)").order("created_at", {ascending:false});
  if(error){ $("list").textContent = "Fehler beim Laden: " + error.message; return; }
  rows = data; render();
}

function render(){
  const f = $("filter").value;
  const shown = rows.filter(p => {
    const w = p.writings[0];
    return f==="all" || (f==="open" && (!w || !w.final_level)) || (f==="done" && w && w.final_level);
  });
  $("cnt").textContent = shown.length + " Einträge";
  const list = $("list"); list.replaceChildren();
  shown.forEach(p => list.append(card(p)));
  if(!shown.length) list.append(el("p", {className:"meta", textContent:"Keine Einträge."}));
}

function card(p){
  const w = p.writings[0];
  const c = el("div", {className:"card"});
  const done = w && w.final_level;
  c.append(el("div", {className:"head"},
    el("span", {className:"name", textContent: p.first_name + " " + p.last_name}),
    el("span", {className:"badge" + (done ? " ok" : ""), textContent: done ? "Bewertet: " + w.final_level : (w ? "Text eingegangen" : "Kein Text")})
  ));
  c.append(el("div", {className:"meta", textContent: [p.email, p.native_language, p.learned_german === false ? "noch kein Deutsch gelernt" : null, fmt(p.created_at)].filter(Boolean).join(" · ")}));
  if(!w) return c;

  c.append(el("div", {className:"meta", textContent: w.word_count + " Wörter · Text auf " + (w.language === "en" ? "Englisch" : "Deutsch")}));
  c.append(el("pre", {textContent: w.text}));
  if(w.ai_level || w.ai_comment) c.append(el("div", {className:"meta", textContent:"KI-Vorschlag: " + (w.ai_level||"") + " – " + (w.ai_comment||"")}));

  const sel = el("select");
  LEVELS.forEach(l => sel.append(el("option", {value:l, textContent:l || "– Niveau wählen –", selected: l === (w.final_level||"")})));
  const com = el("textarea", {rows:3, value: w.comment || "", placeholder:"Kommentar (nur für dich)"});
  const msg = el("span", {className:"msg"});
  const save = el("button", {textContent:"Bewertung speichern"});
  save.onclick = async () => {
    const upd = { final_level: sel.value || null, comment: com.value || null, reviewed_at: new Date().toISOString() };
    const { error } = await sb.from("writings").update(upd).eq("id", w.id);
    msg.textContent = error ? "Fehler: " + error.message : "Gespeichert";
    if(!error) Object.assign(w, upd);
  };
  c.append(el("div", {className:"grid"}, el("label", {textContent:"Niveau"}), sel, el("label", {textContent:"Kommentar"}), com));
  c.append(el("div", {style:"margin-top:10px"}, save, msg));
  return c;
}
check();
</script>
</body>
</html>
